name: Sync upstream and build Docker image

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - '.agents/**'

concurrency:
  group: upstream-sync-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Sync upstream
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Upstream updates workflow files; GITHUB_TOKEN cannot push those changes.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge upstream
        env:
          UPSTREAM_URL: https://github.com/QuantumNous/new-api.git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base_sha="$(git rev-parse HEAD)"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main

          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Upstream merge failed. Resolve conflicts manually, then rerun the workflow."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" = "$base_sha" ]; then
            echo "No upstream changes to push."
            exit 0
          fi

          # The PAT push triggers build-docker in a separate push run.
          git push origin "HEAD:${GITHUB_REF_NAME}"

  build-docker:
    name: Build Docker image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
